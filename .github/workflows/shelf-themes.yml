name: shelf-themes

# Builds Lumen with both backends once (job build), then, from that build and
# in parallel, runs the contract tests (tests/contract) on X11 (Xvfb) and on
# Wayland (headless wlroots), and shoots the shelf under every bundled theme,
# checking that its colours read (tools/shelf-themes.sh). The screenshots are
# kept as an artifact. A change that only touches documentation skips all of
# it, and the themes check still reports, so it can stay a required check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same pull request cancels the run it makes stale; on
# main every commit runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PREFIX: /home/runner/ob

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # code=false only when every changed file is Markdown or under docs/;
        # with no base to compare against (a new branch, a manual run) it runs
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD | tee "$RUNNER_TEMP/changed"
            grep -qvE '(\.md$|^docs/)' "$RUNNER_TEMP/changed" || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # a stuck mirror or a hung step fails the job instead of holding it
    timeout-minutes: 15
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deps
        timeout-minutes: 10
      # meson compiles through ccache when it is installed; the cache of
      # the newest run is restored, so only changed files are compiled
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Build, unit tests and install
        run: |
          ccache --zero-stats
          meson setup build --prefix="$PREFIX" -Dwayland=enabled
          meson compile -C build
          ccache --show-stats
          meson test -C build --print-errorlogs
          meson install -C build
      # tar keeps modes and symlinks (openbox -> lumen-wm), which the
      # artifact zip would drop; the prefix is the same path on every runner.
      # runtime-packages lists what the binaries link against, for the tests
      - name: Pack the build
        run: |
          out=lumen-build
          mkdir -p "$out"
          tar -cf "$out/prefix.tar" -C "$(dirname "$PREFIX")" "$(basename "$PREFIX")"
          tar -cf "$out/contract.tar" build/contract-x11 build/contract-wayland
          find "$PREFIX" build/contract-x11 build/contract-wayland -type f \
              \( -perm -u+x -o -name '*.so*' \) -exec ldd {} + 2>/dev/null |
            awk '/=> \//{print $3}' | sort -u | xargs -r readlink -f |
            xargs -r dpkg -S 2>/dev/null | cut -d: -f1 | sort -u \
            > "$out/runtime-packages"
          cat "$out/runtime-packages"
          test -s "$out/runtime-packages"
      - uses: actions/upload-artifact@v6
        with:
          name: lumen-build
          path: lumen-build/
          retention-days: 1

  contract:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [x11, wayland]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: lumen-build
          path: lumen-build
      - uses: ./.github/actions/deps
        timeout-minutes: 10
        with:
          runtime: lumen-build/runtime-packages
      - name: Unpack the build
        run: |
          mkdir -p "$(dirname "$PREFIX")"
          tar -xf lumen-build/prefix.tar -C "$(dirname "$PREFIX")"
          tar -xf lumen-build/contract.tar
      - name: Contract tests on ${{ matrix.backend }}
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.backend }}" = x11 ]; then
            tests/contract/run.sh "$PREFIX"
          else
            tests/contract/run-wayland.sh "$PREFIX"
          fi

  themes:
    needs: [changes, build]
    # runs (and fails) when the build failed too, so a required themes
    # check never passes as skipped on a broken build
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: The build passed
        run: test "${{ needs.build.result }}" = success
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: lumen-build
          path: lumen-build
      - uses: ./.github/actions/deps
        timeout-minutes: 10
        with:
          runtime: lumen-build/runtime-packages
      - name: Unpack the build
        run: |
          mkdir -p "$(dirname "$PREFIX")"
          tar -xf lumen-build/prefix.tar -C "$(dirname "$PREFIX")"
      # every theme on a display of its own, as many at once as CPUs
      - name: Shoot the themes
        timeout-minutes: 10
        # with a compositor, so the menus take the cairo path
        env:
          COMPOSITOR: 1
        run: tools/shelf-themes.sh "$PREFIX" "$RUNNER_TEMP/shelf-themes.png"
      - uses: actions/upload-artifact@v6
        if: always() && needs.build.result == 'success'
        with:
          name: shelf-themes
          path: ${{ runner.temp }}/shelf-themes*.png
