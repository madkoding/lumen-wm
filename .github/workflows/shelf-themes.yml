name: shelf-themes

# Builds Lumen, runs the contract tests (tests/contract), then shoots the shelf
# under every bundled theme and checks that its colours read
# (tools/shelf-themes.sh). The screenshots are kept as an artifact.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  themes:
    runs-on: ubuntu-24.04
    # a stuck mirror or a hung X client fails the job instead of holding it
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo -E apt-get -o Acquire::Retries=3 update
          sudo -E apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential meson ninja-build \
            gettext pkg-config libglib2.0-dev libxml2-dev \
            libpango1.0-dev libcairo2-dev libx11-dev libxext-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev \
            libimlib2-dev libsm-dev libice-dev libxtst-dev \
            xvfb xdotool xterm imagemagick fonts-dejavu-core picom hsetroot
      - name: Build and install
        run: |
          meson setup build --prefix="$HOME/ob"
          meson compile -C build
          meson test -C build --print-errorlogs
          meson install -C build
      - name: Contract tests
        timeout-minutes: 5
        run: tests/contract/run.sh "$HOME/ob"
      - name: Shoot the themes
        timeout-minutes: 10
        # with a compositor, so the menus take the cairo path
        env:
          COMPOSITOR: 1
        run: tools/shelf-themes.sh "$HOME/ob" "$RUNNER_TEMP/shelf-themes.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shelf-themes
          path: ${{ runner.temp }}/shelf-themes*.png
