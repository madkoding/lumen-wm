name: shelf-themes

# Builds Openbox, then shoots the shelf under every bundled theme and checks
# that its colours read (tools/shelf-themes.sh). The screenshots are kept as an
# artifact.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  themes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            autopoint gettext pkg-config libglib2.0-dev libxml2-dev \
            libpango1.0-dev libcairo2-dev libx11-dev libxext-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev \
            libimlib2-dev libsm-dev libice-dev \
            xvfb xdotool xterm imagemagick fonts-dejavu-core picom hsetroot
      - name: Build and install
        run: |
          ./bootstrap
          mkdir ../build && cd ../build
          "$GITHUB_WORKSPACE/configure" --prefix="$HOME/ob"
          make -j"$(nproc)"
          make install
      - name: Shoot the themes
        # with a compositor, so the menus take the cairo path
        env:
          COMPOSITOR: 1
        run: tools/shelf-themes.sh "$HOME/ob" "$RUNNER_TEMP/shelf-themes.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shelf-themes
          path: ${{ runner.temp }}/shelf-themes*.png
